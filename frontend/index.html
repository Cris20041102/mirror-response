<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirror Response</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/style.css">
    <meta name="theme-color" content="#2C3E50">
</head>
<body>
    <div class="container">
        <h2>Mirror Response</h2>
        <p>¿Qué llevas en tu corazón hoy? Exprésate libremente.</p>

        <textarea id="userInput" placeholder="Me siento..."></textarea>
        <button id="sendBtn">Compartir</button>
        <button id="historyBtn" class="btn-secondary">Ver historial</button>

        <div id="response-area" style="display: none;">
            <div class="card" id="validationText"></div>
            <div class="card" id="messageText"></div>
            <p><strong>🎧 Recomendación:</strong> <span id="songText"></span></p>
            <p><strong>✨ Acción:</strong> <span id="actionText"></span></p>
        </div>
    </div>

    <div id="history-modal" class="modal-overlay" style="display:none;">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Tu viaje emocional</h3>
                <button id="closeHistoryBtn" class="close-btn">✕</button>
            </div>
            <div id="mood-banner" class="mood-banner"></div>
            <div id="history-list"></div>
        </div>
    </div>

    <script src="/js/app.js"></script>
    <script src="/js/history.js"></script>
</body>
</html>
