<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mirror Response</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="/css/style.css">
    <meta name="theme-color" content="#2C3E50">
</head>
<body>
    <div class="container">
        <h2>Mirror Response</h2>
        <p>¿Qué llevas en tu corazón hoy? Exprésate libremente.</p>
        
        <textarea id="userInput" placeholder="Me siento..."></textarea>
        <button id="sendBtn">Compartir</button>

        <div id="response-area" style="display: none;">
            <div class="card" id="validationText"></div>
            <div class="card" id="messageText"></div>
            <p><strong>🎧 Recomendación:</strong> <span id="songText"></span></p>
            <p><strong>✨ Acción:</strong> <span id="actionText"></span></p>
        </div>
    </div>

    <script src="/js/app.js"></script>
</body>
</html>
